<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Send Text</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #09090b;
            color: #fafafa;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .header p {
            color: #a1a1aa;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        textarea {
            width: 100%;
            height: 240px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 16px;
            color: #fff;
            font-size: 1rem;
            line-height: 1.6;
            outline: none;
            resize: none;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        textarea:focus {
            border-color: #3b82f6;
            background: #1c1c1f;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        textarea::placeholder {
            color: #52525b;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #27272a;
            color: #71717a;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            text-align: center;
            font-size: 0.85rem;
            min-height: 1.25rem;
            transition: color 0.2s;
        }

        .status.success {
            color: #22c55e;
        }

        .status.error {
            color: #ef4444;
        }

        .loader {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .sending .loader {
            display: block;
        }

        .sending .btn-text {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Shared Clipboard</h1>
            <p>Enter text to instantly send it to the device</p>
        </div>

        <div class="input-wrapper">
            <textarea id="textInput" placeholder="Type or paste something..." oninput="updateBtn()"></textarea>
        </div>

        <div id="status" class="status"></div>

        <button id="sendBtn" class="btn" onclick="sendText()" disabled>
            <div class="loader"></div>
            <span id="btnText" class="btn-text">Send to device</span>
        </button>
    </div>

    <script>
        const input = document.getElementById('textInput');
        const btn = document.getElementById('sendBtn');
        const btnText = document.getElementById('btnText');
        const status = document.getElementById('status');

        function updateBtn() {
            btn.disabled = !input.value.trim();
        }

        async function getTransferToken(type, filename, filesize) {
            const id = crypto.randomUUID();
            const device_name = "Web Browser";

            const res = await fetch("/request", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id, device_name, type, filename, filesize }),
            });

            if (!res.ok) {
                if (res.status === 408) throw new Error("Request timed out");
                throw new Error("Handshake failed: " + res.status);
            }

            const data = await res.json();
            if (!data.accepted) throw new Error("Rejected");
            return data.token;
        }

        async function sendText() {
            const text = input.value.trim();
            if (!text) return;

            btn.disabled = true;
            status.textContent = 'Waiting for acceptance…';
            status.className = 'status';

            try {
                const token = await getTransferToken("text", null, text.length);

                document.body.classList.add('sending');
                status.textContent = 'Sending…';

                const response = await fetch('/text', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                        'X-Transfer-Token': token
                    },
                    body: text
                });

                if (response.ok) {
                    status.textContent = 'Sent successfully! ✓';
                    status.classList.add('success');
                    input.value = '';
                    updateBtn();
                } else {
                    status.textContent = 'Server error: ' + response.status;
                    status.classList.add('error');
                }
            } catch (err) {
                status.textContent = err.message === "Rejected" ? "Transfer rejected by receiver" : 'Failed: ' + err.message;
                status.classList.add('error');
            } finally {
                document.body.classList.remove('sending');
                if (input.value.trim()) btn.disabled = false;
            }
        }
    </script>
</body>

</html>
